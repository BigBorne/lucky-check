{% extends 'accounts/base.html' %}
{% block title %}Регистрация — Чек на удачу{% endblock %}
{% block content %}
<h1>Создать аккаунт</h1>
<form method="post">{% csrf_token %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
    {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
  {% endfor %}
  <button type="submit">Зарегистрироваться</button>
</form>
<p class="switch">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
{% endblock %}
